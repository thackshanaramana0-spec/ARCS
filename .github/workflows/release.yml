name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.2.0)'
        required: true
        default: 'v2.2.0'

jobs:
  build-linux:
    name: Build Linux binary and publish release
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake build-essential zlib1g-dev liblzma-dev libzstd-dev

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build portable binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DARCS_NATIVE=OFF \
            -DARCS_PORTABLE=ON
          cmake --build build --parallel $(nproc)
          strip build/arcs
          cp build/arcs arcs-linux-x86_64

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -j$(nproc)

      - name: Extract changelog
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          VERSION="${TAG#v}"
          awk "/^## v${VERSION}/{found=1; next} found && /^## v/{exit} found{print}" CHANGELOG.md \
            | sed '/^[[:space:]]*$/d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See CHANGELOG.md for full details." > release_notes.md
          fi
          cat release_notes.md

      - name: Create source tarball
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          git archive --format=tar.gz --prefix=ARCS-${TAG}/ HEAD \
            -o ARCS-${TAG}-source.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "ARCS ${TAG}" \
            --notes-file release_notes.md \
            arcs-linux-x86_64 \
            ARCS-${TAG}-source.tar.gz
